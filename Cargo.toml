[package]
name = "arabic_norm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fast Arabic text normalization for RAG preprocessing (PyO3 extension)"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.28.2"
rayon = "1.10"

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = "thin"
codegen-units = 1
