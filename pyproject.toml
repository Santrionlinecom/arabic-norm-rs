[project]
name = "arabic-norm"
version = "0.1.0"
description = "Fast Arabic text normalization (tashkeel/tatweel/alif/ya) for RAG preprocessing, written in Rust with PyO3"
readme = "README.md"
license = "MIT"
authors = [{ name = "santrionlinecom", email = "websantrionline@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Natural Language :: Arabic",
    "Topic :: Text Processing :: Linguistic",
]

[tool.maturin]
module-name = "arabic_norm._core"
python-source = "python"
features = ["extension-module"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "matplotlib>=3.10.9",
    "maturin>=1.15.0",
    "pandas>=2.3.3",
    "polars>=2.0.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["bench/data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PERF", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Arabic text in strings/comments is intentional

[tool.ruff.lint.isort]
known-first-party = ["arabic_norm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
